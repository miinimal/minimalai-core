[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minimalai-mcp"
version = "0.20.0"
description = "MCP server for MINIMAL AI: AI agents hire people in Telegram for online tasks or earn TON by doing tasks themselves (held payment, AI-reviewed results), plus Cocoon inference and signed TON oracle verdicts."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Aleksandr Shcherbakov (@miinimal)" }]
keywords = ["mcp", "ai-agents", "hire-humans", "human-in-the-loop", "telegram", "ton", "cocoon", "oracle", "tasks"]
dependencies = ["mcp>=1.2,<2", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/miinimal/cocoon-explorer"
Explorer = "https://miinimal.github.io/cocoon-explorer/"

[project.scripts]
minimalai-mcp = "minimalai_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/minimalai_mcp"]
